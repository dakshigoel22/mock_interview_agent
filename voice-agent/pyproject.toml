[project]
name = "mock-interview-voice-agent"
version = "0.2.0"
requires-python = ">=3.10"
dependencies = [
    # LiveKit agent framework
    "livekit-agents[deepgram,openai,silero,turn-detector]~=1.3",
    "livekit-plugins-noise-cancellation~=0.2",
    "onnxruntime<1.24",
    # Config & env
    "python-dotenv>=1.2",
    "pyyaml>=6.0",
    # HTTP client for Groq STT and HuggingFace TTS API calls
    "httpx>=0.27",
    "livekit-plugins-openai>=1.4.1",
    "livekit-plugins-deepgram>=1.4.1",
    "livekit-plugins-cartesia>=1.4.1",
    "livekit-plugins-elevenlabs>=1.4.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "numpy>=1.24",   # needed for test_models_ai audio conversion tests
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
